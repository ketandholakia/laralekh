# Continuous integration for LaraLekh.
#
# Every pull request targeting main and every push to main is validated with
# the same isolated environment used locally: SQLite in-memory for the Pest
# suite (phpunit.xml pins DB_CONNECTION=sqlite and DB_DATABASE=:memory:), so
# CI never touches a development or production database. The tests/TestCase.php
# laravix_test_ guard stays in force; no workflow step weakens it.
#
# No secrets are used in this workflow; no continue-on-error or fallback flags
# are set, so failing tests fail the workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.4 with required extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install PHP dependencies from lockfile
        run: composer install --prefer-dist --no-interaction --no-progress

      # The feature suite boots the HTTP kernel, whose cookie and session
      # middleware require an application key. This creates a throwaway key on
      # the ephemeral runner from the committed template; it holds no secrets.
      - name: Prepare ephemeral application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Boot configuration checks
        run: |
          php artisan config:clear --no-ansi
          php artisan route:list --no-ansi > /dev/null

      - name: Run Pest test suite
        run: vendor/bin/pest

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Verify build output exists
        run: test -f public/css/app.css

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (full history for diff checks)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer validation
        run: composer validate --strict

      - name: Dependency platform consistency
        run: composer check-platform-reqs --lock

      - name: PHP syntax checks
        run: |
          find app config database routes -type f -name '*.php' -print0 \
            | xargs -0 -n 1 -P 4 php -l > /dev/null
          echo "PHP syntax OK"

      - name: Git whitespace check
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ] || [ "$BASE" = "null" ]; then
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No diff base for this trigger; skipping whitespace check."
            exit 0
          fi
          git diff --check "$BASE" HEAD

  mysql:
    name: Backend tests & trigger parity (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: laravix84
          MYSQL_DATABASE: laravix_test_suite
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -plaravix84"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.4 with MySQL extensions
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, iconv, intl, mbstring, pdo, pdo_mysql, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none

      - name: Install MySQL client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client

      - name: Install PHP dependencies from lockfile
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare ephemeral application key
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Verify MySQL migration up / rollback / up
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravix_test_migrations
          DB_USERNAME: root
          DB_PASSWORD: laravix84
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -plaravix84 \
            -e "DROP DATABASE IF EXISTS laravix_test_migrations; CREATE DATABASE laravix_test_migrations CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php tools/verify-migrations.php

      - name: Run MySQL trigger parity, tenancy, and posting tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravix_test_suite
          DB_USERNAME: root
          DB_PASSWORD: laravix84
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          vendor/bin/pest tests/Feature/ImmutabilityTriggerParityTest.php tests/Feature/TenancyTest.php tests/Feature/PostingServiceTest.php

      - name: Verify MySQL backup & restore end-to-end
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laravix_test_suite
          DB_USERNAME: root
          DB_PASSWORD: laravix84
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: php tools/verify-backup-restore.php
